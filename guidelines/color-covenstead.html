<!-- @dsCard group="Colors" viewport="700x250" name="Covenstead Palette" subtitle="The Truth — obsidian night lit by nebula gold, nebula & violet" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--night); color: var(--text-bright); padding: 24px; font-family: var(--font-mono); }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .sw { border-radius: 2px; border: 1px solid rgba(255,255,255,0.06); padding: 10px; height: 78px; display: flex; flex-direction: column; justify-content: flex-end; }
  .nm { font-size: 0.52rem; letter-spacing: 0.08em; text-transform: uppercase; }
  .hx { font-size: 0.5rem; opacity: 0.65; }
</style>
</head>
<body>
<div class="grid">
  <div class="sw" style="background:var(--night)"><span class="nm">Night</span><span class="hx">#05050A</span></div>
  <div class="sw" style="background:var(--obsidian)"><span class="nm">Obsidian</span><span class="hx">#0A0A14</span></div>
  <div class="sw" style="background:var(--obsidian-mid)"><span class="nm">Surface</span><span class="hx">#0F0F1E</span></div>
  <div class="sw" style="background:var(--marble)"><span class="nm">Marble</span><span class="hx">#0C0C10</span></div>
  <div class="sw" style="background:var(--text-dim)"><span class="nm">Dim</span><span class="hx">#4A4362</span></div>
  <div class="sw" style="background:var(--gold);color:#05050A"><span class="nm">Gold</span><span class="hx">#D4A94B</span></div>
  <div class="sw" style="background:var(--gold-bright);color:#05050A"><span class="nm">Gold Bright</span><span class="hx">#E8B84B</span></div>
  <div class="sw" style="background:var(--nebula);color:#05050A"><span class="nm">Nebula-Glass</span><span class="hx">#A8DCEE</span></div>
  <div class="sw" style="background:var(--nebula-bright);color:#05050A"><span class="nm">Nebula-Glass Bt</span><span class="hx">#C8EEFF</span></div>
  <div class="sw" style="background:var(--pulse-amber);color:#05050A"><span class="nm">Pulse</span><span class="hx">#F59E0B</span></div>
  <div class="sw" style="background:var(--violet)"><span class="nm">Violet</span><span class="hx">#8B5CF6</span></div>
  <div class="sw" style="background:var(--rose);color:#05050A"><span class="nm">Rose</span><span class="hx">#F472B6</span></div>
  <div class="sw" style="background:var(--nebula-pink);color:#05050A"><span class="nm">Pink</span><span class="hx">#E86CA0</span></div>
  <div class="sw" style="background:var(--fire-orange);color:#05050A"><span class="nm">Fire</span><span class="hx">#FF7800</span></div>
  <div class="sw" style="background:var(--fire-red)"><span class="nm">Wildfire</span><span class="hx">#D73700</span></div>
</div>
</body>
</html>
