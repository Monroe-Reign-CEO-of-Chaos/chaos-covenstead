<!-- @dsCard group="Brand" viewport="700x230" name="Wordmark" subtitle="Cinzel logo, gold→rose gradient, on obsidian with a glass nav" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--night); color: var(--text-bright); padding: 0; }
  .nav { height: 60px; display: flex; align-items: center; padding: 0 28px; background: rgba(5,5,10,0.72); backdrop-filter: blur(18px); border-bottom: 1px solid rgba(212,169,75,0.1); }
  .logo { font-family: var(--font-display); font-weight: 700; font-size: 0.72rem; letter-spacing: 0.3em; text-transform: uppercase; background: var(--grad-gold-rose); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .hero { padding: 36px 28px; }
  .big { font-family: var(--font-display); font-weight: 900; font-size: 2.4rem; letter-spacing: 0.04em; text-transform: uppercase; background: var(--grad-gold-rose); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 26px rgba(212,169,75,0.35)); }
  .tag { font-family: var(--font-mono); font-size: 0.55rem; letter-spacing: 0.4em; text-transform: uppercase; color: var(--violet); margin-top: 14px; }
</style>
</head>
<body>
<div class="nav"><span class="logo">Chaos Covenstead</span></div>
<div class="hero">
  <div class="big">Chaos Covenstead</div>
  <div class="tag">Monroe Reign — Cinematic Lore Codex</div>
</div>
</body>
</html>
