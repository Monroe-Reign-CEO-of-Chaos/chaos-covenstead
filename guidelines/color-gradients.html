<!-- @dsCard group="Colors" viewport="700x190" name="Signature Gradients" subtitle="Sovereign, Heartspire, gold→rose, wildfire & pulse rule" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--night); color: var(--text-bright); padding: 24px; font-family: var(--font-mono); }
  .row { display: flex; flex-direction: column; gap: 12px; }
  .bar { height: 30px; border-radius: 2px; display: flex; align-items: center; padding-left: 12px; }
  .nm { font-size: 0.52rem; letter-spacing: 0.2em; text-transform: uppercase; color: #05050A; font-weight: 700; }
  .rule { height: 2px; filter: drop-shadow(0 0 6px rgba(212,169,75,0.5)); }
</style>
</head>
<body>
<div class="row">
  <div class="bar" style="background:var(--grad-sovereign)"><span class="nm">Sovereign · gold → pink → violet</span></div>
  <div class="bar" style="background:var(--grad-heartspire)"><span class="nm">Heartspire · gold ↔ nebula ↔ pulse</span></div>
  <div class="bar" style="background:var(--grad-gold-rose)"><span class="nm">Gold → Rose · logos</span></div>
  <div class="bar" style="background:var(--grad-wildfire)"><span class="nm">Wildfire · Monroe's ignition</span></div>
  <div class="bar rule" style="background:var(--grad-pulse-rule)"></div>
</div>
</body>
</html>
