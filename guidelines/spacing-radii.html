<!-- @dsCard group="Spacing" viewport="700x170" name="Radii & Bevel" subtitle="Carved, not rounded — 2px default, the signature beveled corner" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--night); color: var(--text-bright); padding: 24px; font-family: var(--font-mono); }
  .row { display: flex; gap: 18px; align-items: flex-end; }
  .box { width: 90px; height: 70px; background: var(--obsidian-mid); border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center; }
  .cap { font-size: 0.5rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-muted); margin-top: 8px; text-align: center; }
  .bevel { clip-path: var(--clip-bevel); border: none; background: linear-gradient(135deg, rgba(212,169,75,0.12), rgba(5,5,10,0.8)); box-shadow: inset 0 0 0 1px var(--glass-border); }
</style>
</head>
<body>
<div class="row">
  <div><div class="box" style="border-radius:0"></div><div class="cap">none · 0</div></div>
  <div><div class="box" style="border-radius:2px"></div><div class="cap">sm · 2px ★</div></div>
  <div><div class="box" style="border-radius:3px"></div><div class="cap">md · 3px</div></div>
  <div><div class="box bevel"></div><div class="cap">clip-bevel</div></div>
  <div><div class="box" style="border-radius:999px;width:70px"></div><div class="cap">pill · avatars</div></div>
</div>
</body>
</html>
