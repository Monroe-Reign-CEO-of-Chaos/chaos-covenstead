<!-- @dsCard group="Type" viewport="700x230" name="Display — Cinzel Decorative" subtitle="Carved-in-stone titles, logos, headings — tracked & uppercase" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--night); color: var(--text-bright); padding: 26px 30px; }
  .meta { font-family: var(--font-mono); font-size: 0.5rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 14px; }
  .big { font-family: var(--font-display); font-weight: 900; font-size: 2.6rem; letter-spacing: 0.05em; text-transform: uppercase; line-height: 1.05;
    background: var(--grad-heartspire); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 30px rgba(212,169,75,0.4)); }
  .sub { font-family: var(--font-display); font-weight: 700; font-size: 0.95rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); margin-top: 16px; }
</style>
</head>
<body>
<div class="meta">Cinzel Decorative · 900 / 700 · ls 0.05–0.1em · UPPERCASE</div>
<div class="big">The Heartspire</div>
<div class="sub">The First Prophecy of the Heartspire</div>
</body>
</html>
