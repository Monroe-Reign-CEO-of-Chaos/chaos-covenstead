<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing Scale" subtitle="4px base rhythm — 4 · 8 · 12 · 16 · 24 · 32 · 48 · 64" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--night); color: var(--text-bright); padding: 26px; font-family: var(--font-mono); }
  .row { display: flex; gap: 14px; align-items: flex-end; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar { background: linear-gradient(180deg, var(--gold), var(--gold-deep)); width: 20px; border-radius: 1px; }
  .cap { font-size: 0.48rem; letter-spacing: 0.1em; color: var(--text-muted); }
</style>
</head>
<body>
<div class="row">
  <div class="col"><div class="bar" style="height:4px"></div><div class="cap">4</div></div>
  <div class="col"><div class="bar" style="height:8px"></div><div class="cap">8</div></div>
  <div class="col"><div class="bar" style="height:12px"></div><div class="cap">12</div></div>
  <div class="col"><div class="bar" style="height:16px"></div><div class="cap">16</div></div>
  <div class="col"><div class="bar" style="height:24px"></div><div class="cap">24</div></div>
  <div class="col"><div class="bar" style="height:32px"></div><div class="cap">32</div></div>
  <div class="col"><div class="bar" style="height:48px"></div><div class="cap">48</div></div>
  <div class="col"><div class="bar" style="height:64px"></div><div class="cap">64</div></div>
</div>
</body>
</html>
