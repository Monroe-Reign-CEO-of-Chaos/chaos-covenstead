<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--night); color: var(--text-bright); padding: 18px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .ph { position: relative; aspect-ratio: 3/4; border-radius: 2px; overflow: hidden; border: 1px solid var(--glass-border); }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cap { position: absolute; bottom: 0; left: 0; right: 0; padding: 14px 8px 6px; font-family: var(--font-mono); font-size: 0.46rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold-bright); background: linear-gradient(transparent, rgba(5,5,10,0.9)); }
</style>
</head>
<body>
<div class="grid">
  <div class="ph"><img src="../assets/imagery/monroe-fire-empire.jpeg" alt="Monroe" /><div class="cap">Ignition</div></div>
  <div class="ph"><img src="../assets/imagery/overlooking-the-empire.jpeg" alt="Empire" /><div class="cap">First Empire</div></div>
  <div class="ph"><img src="../assets/imagery/hollow-threshold-dna.jpg" alt="Threshold" /><div class="cap">Threshold</div></div>
  <div class="ph"><img src="../assets/imagery/echo-vessel-altar.jpg" alt="Echo vessel" /><div class="cap">Echo Vessel</div></div>
</div>
</body>
</html>
