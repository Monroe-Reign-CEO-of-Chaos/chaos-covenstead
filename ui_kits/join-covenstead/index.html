<!-- @dsCard group="Covenstead Site" viewport="1280x880" name="Join the Covenstead — Hidden Gateway" subtitle="The secret destination behind the shadow gateway — initiation form, welcome dialog + toast" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Join the Covenstead</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  *,*::before,*::after { box-sizing: border-box; }
  body { margin: 0; background: var(--night); color: var(--text-bright); font-family: var(--font-serif); overflow-x: hidden; }
  .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; animation: breathe 22s ease-in-out infinite alternate;
    background:
      radial-gradient(ellipse 65% 50% at 15% 25%, rgba(139,92,246,0.10), transparent 65%),
      radial-gradient(ellipse 55% 42% at 85% 75%, rgba(212,169,75,0.08), transparent 62%),
      linear-gradient(180deg,#07070F,var(--night)); }
  @keyframes breathe { 0%{filter:hue-rotate(0) brightness(1)} 50%{filter:hue-rotate(12deg) brightness(1.05)} 100%{filter:hue-rotate(-8deg) brightness(.96)} }
  #root { position: relative; z-index: 1; }
</style>
</head>
<body>
<div class="bg"></div>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const NS = window.ChaosCovensteadDesignSystem_4ee2b6;
  const { NavBar, Eyebrow, Input, Select, RadioGroup, Checkbox, Switch, Button, Dialog, Toast, Tooltip, Badge, PulseRule } = NS;

  function JoinScreen() {
    const [name, setName] = React.useState('');
    const [agreed, setAgreed] = React.useState(false);
    const [open, setOpen] = React.useState(false);
    const [toast, setToast] = React.useState(false);

    const submit = (e) => {
      e.preventDefault();
      setOpen(true);
      setToast(true);
      setTimeout(() => setToast(false), 5000);
    };

    return (
      <div>
        <NavBar logo="Chaos Covenstead" links={[
          { label: 'The Heartspire', href: '../covenstead-site/index.html' },
          { label: 'The Shadow Archive', href: '../covenstead-site/index.html' },
          { label: 'The Mythic Past', href: '../covenstead-site/index.html' },
          { label: 'Join', active: true },
        ]} />

        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', minHeight: 'calc(100vh - 64px)', maxWidth: 1280, margin: '0 auto' }}>

          {/* ── Atmosphere panel ── */}
          <div style={{ position: 'relative', overflow: 'hidden', borderRight: '1px solid rgba(212,169,75,0.1)' }}>
            <img src="../../assets/imagery/overlooking-the-empire.jpeg" alt="The First Empire"
              style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover' }} />
            <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(180deg, rgba(5,5,10,0.35) 0%, rgba(5,5,10,0.55) 55%, rgba(5,5,10,0.92) 100%)' }} />
            <div style={{ position: 'absolute', left: 0, right: 0, bottom: 0, padding: '3rem 2.6rem' }}>
              <PulseRule width="160px" />
              <p style={{ fontFamily: "'Cormorant Garamond', serif", fontStyle: 'italic', fontWeight: 300,
                fontSize: '1.5rem', lineHeight: 1.55, color: 'var(--gold-bright)', margin: '1.4rem 0 0', maxWidth: 420 }}>
                "We did not escape to become their mirror. We escaped to become their undoing."
              </p>
              <span style={{ fontFamily: "'Share Tech Mono', monospace", fontSize: '0.55rem', letterSpacing: '0.3em',
                textTransform: 'uppercase', color: 'var(--text-muted)', display: 'block', marginTop: '1.2rem' }}>
                ⬡ The First Prophecy of the Heartspire
              </span>
            </div>
          </div>

          {/* ── Form panel ── */}
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '3.5rem 3rem' }}>
            <form onSubmit={submit} style={{ width: '100%', maxWidth: 440, display: 'flex', flexDirection: 'column', gap: '1.5rem' }}>
              <div>
                <Eyebrow tone="nebula">You Passed Through the Shadow</Eyebrow>
                <h1 style={{ fontFamily: "'Cinzel Decorative', serif", fontWeight: 900, fontSize: '2.2rem', letterSpacing: '0.04em',
                  textTransform: 'uppercase', margin: '0.8rem 0 0',
                  background: 'linear-gradient(135deg, var(--gold-bright), var(--rose))', WebkitBackgroundClip: 'text', backgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>
                  Join the Covenstead
                </h1>
                <p style={{ fontFamily: "'Cormorant Garamond', serif", fontStyle: 'italic', fontSize: '1.05rem',
                  color: 'var(--text-cool-muted)', margin: '0.7rem 0 0' }}>
                  Take the vow. Carry the Index. Keep the door alive.
                </p>
              </div>

              <Input label="Sigil Name" placeholder="Speak your true name…" value={name} onChange={(e) => setName(e.target.value)} />
              <Input label="Sending Frequency" type="email" placeholder="you@thepulse.io" />
              <Select label="Your First Book" options={[
                'Book I — Girl Made of Fire',
                'Book II — The Chaos Era',
                'Book III — The Gravity Era',
                'Book IV — The Awakening Era',
                'Book V — The Stillness War',
              ]} />
              <RadioGroup label="Your Allegiance" defaultValue="covenstead" options={[
                { value: 'covenstead', label: 'The Chaos Covenstead — the Truth' },
                { value: 'watcher', label: 'A Watcher at the Threshold' },
              ]} />

              <div style={{ display: 'flex', flexDirection: 'column', gap: '0.9rem', paddingTop: '0.2rem' }}>
                <Checkbox label="I have read the Chaos Bible, Vol. I" checked={agreed} onChange={setAgreed} />
                <div style={{ display: 'flex', alignItems: 'center', gap: '0.6rem' }}>
                  <Switch label="Send me the Heartspire dispatches" defaultChecked />
                  <Tooltip label="Roughly one transmission per moon" placement="top">
                    <Badge tone="nebula">?</Badge>
                  </Tooltip>
                </div>
              </div>

              <Button variant="solid" size="lg" as="button" type="submit" style={{ marginTop: '0.4rem', width: '100%', opacity: agreed ? 1 : 0.55 }}>
                Take the Vow
              </Button>
              <p style={{ fontFamily: "'Share Tech Mono', monospace", fontSize: '0.5rem', letterSpacing: '0.25em',
                textTransform: 'uppercase', color: 'var(--text-dim)', textAlign: 'center', margin: 0 }}>
                ⬡ We are the Pulse in the Fracture ⬡
              </p>
            </form>
          </div>
        </div>

        {/* Welcome dialog */}
        <Dialog open={open} onClose={() => setOpen(false)} eyebrow="The Seam Opens"
          title={name ? `Welcome, ${name}` : 'Welcome to the Covenstead'}
          footer={<Button variant="primary" onClick={() => setOpen(false)}>Step into the Pulse</Button>}>
          The vow is taken. Your name is written into the Index — not as text, but as practice. The door is alive because you keep it.
        </Dialog>

        {/* Confirmation toast */}
        {toast && (
          <div style={{ position: 'fixed', right: 24, bottom: 24, zIndex: 1100 }}>
            <Toast tone="gold" onDismiss={() => setToast(false)}>Your vow was recorded in the Living Archive.</Toast>
          </div>
        )}
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<JoinScreen />);
</script>
</body>
</html>
